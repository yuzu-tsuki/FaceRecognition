[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-doorbell"
description = "Webcam door bell that recognises whitelisted faces and logs attendance."
readme = "README.md"
# numpy 2.2 dropped Python 3.9, so the pin below already rules it out.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yukinohana" }]
keywords = ["face-recognition", "opencv", "attendance", "doorbell"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Environment :: Console",
]
dynamic = ["version"]
dependencies = [
    "numpy==2.2.6",
    "opencv-python~=4.12.0.88",
    "face_recognition~=1.3.0",
    "face_recognition_models~=0.3.0",
    # face_recognition_models 0.3.0 does `from pkg_resources import resource_filename`
    # at import time. pkg_resources ships with setuptools and was removed in 81, and
    # it is no longer present by default on Python 3.12+, so face_recognition fails
    # to import without this. Drop the pin if face_recognition_models ever stops
    # using pkg_resources.
    "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frdb = "face_recognition_doorbell.cli:main"

[project.urls]
Repository = "https://github.com/daechan0615/FaceRecognition"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "face_recognition_doorbell.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deliberately narrower than pytest's default, which also matches *_test.py.
# Runnable scripts in this project have historically used that suffix and execute
# on import, so collection alone would open the webcam.
python_files = ["test_*.py"]
